<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revitalize Project Progress</title><style>body{margin:0;font-family:Arial;background:#f7f5ef;color:#1b1b1b}main{max-width:1050px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d7d0bf;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 20px #0001}h1{font-family:Georgia,serif;color:#37412f}.btn,button{border:0;border-radius:12px;padding:12px 14px;background:#37412f;color:#fff;font-weight:900;text-decoration:none;display:inline-block;margin:5px}.gold{background:#b69a55;color:#111}.light{background:#eef0ea;color:#37412f;border:1px solid #d7d0bf}select,textarea{width:100%;padding:12px;border:1px solid #bbb;border-radius:12px;font-size:16px}.pill{display:inline-block;background:#eef0ea;color:#37412f;border:1px solid #d7d0bf;border-radius:999px;padding:5px 8px;margin:2px;font-size:12px;font-weight:800}.progress{height:20px;background:#eee;border:1px solid #d7d0bf;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(135deg,#37412f,#b69a55)}.task{display:flex;gap:10px;align-items:flex-start;background:#fbfaf6;border:1px solid #d7d0bf;border-radius:12px;padding:10px;margin:8px 0}.task input{width:22px;height:22px}.done{text-decoration:line-through;opacity:.65}.small{font-size:13px;color:#555}.hidden{display:none}</style></head><body><main><section class="card"><h1>Project Progress</h1><p>Working progress tracker. Admin can check off tasks; clients and agents can view progress.</p><a class="btn light" href="./">Booking</a><a class="btn light" href="admin.html">Admin</a><a class="btn light" href="portal.html">Portal</a></section><section class="card"><h2>Select Project</h2><select id="sel" onchange="load()"></select></section><section id="view" class="hidden"><section class="card"><h2 id="title"></h2><span class="pill" id="status"></span><span class="pill" id="service"></span><p><b>Address:</b> <span id="addr"></span></p><p><b>Estimate:</b> <span id="est"></span></p><div class="progress"><div id="bar" class="bar" style="width:0%"></div></div><p id="pct" class="small"></p></section><section class="card"><h2>Task Checklist</h2><div id="tasks"></div><button class="gold" onclick="saveNow()">Save Progress</button><button class="light" onclick="resetNow()">Reset Tasks</button><button onclick="window.print()">Print</button></section><section class="card"><h2>Public Notes</h2><textarea id="notes"></textarea><button onclick="saveNow()">Save Notes</button></section></section></main><script>const L='revitalize_booking_leads',P='revitalize_project_progress',A='revitalize_admin_logged_in';let leads=[],progress={},current=null;const banks={interior:['Confirm colors','Protect surfaces','Patch holes','Sand/prep','Prime repairs','Paint coat 1','Paint coat 2','Cleanup','Final walkthrough'],exterior:['Inspect exterior','Wash surfaces','Scrape/sand','Caulk','Prime','Paint siding/trim','Cleanup','Final walkthrough'],handyman:['Confirm punch list','Gather materials','Protect area','Complete repair/install','Test work','Cleanup','Final walkthrough'],drywall:['Patch area','Tape/mud','Sand','Texture match','Prime','Paint touch-up','Cleanup'],pressure:['Protect outlets/plants','Apply cleaner','Wash','Rinse','Inspect','Cleanup'],rentready:['Move-out walkthrough','Trash removal','Safety items/locks','Repairs','Paint/touch-up','Flooring/trim','Deep clean','Final move-in inspection'],garage:['Inspect concrete','Grind/etch','Repair cracks','Base coat','Chip broadcast','Top coat','Cure','Final walkthrough'],deckfence:['Wash wood','Strip/brighten','Dry time','Apply stain/sealer','Inspect','Cleanup']};function get(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}function isAdmin(){return localStorage.getItem(A)==='yes'}function taskList(l){let t=((l.mainServices||'')+' '+(l.specificItems||'')+' '+(l.turnPackage||'')).toLowerCase(),out=[];Object.keys(banks).forEach(k=>{if(t.includes(k)||k==='pressure'&&t.includes('wash')||k==='rentready'&&(t.includes('turn')||t.includes('rent-ready'))||k==='deckfence'&&(t.includes('deck')||t.includes('fence')))out=out.concat(banks[k])});return [...new Set(out.length?out:banks.handyman)]}function seed(){if(get(L,[]).length)return;let sample=[{id:701,name:'Customer Test',email:'customer@revitalize.test',address:'Customer Project',mainServices:'interior',specificItems:'Walls and trim',roughEstimate:'$2,000 - $3,500',status:'Quote Scheduled'},{id:702,name:'Property Manager Test',email:'propertymanager@revitalize.test',address:'PM Unit 12',mainServices:'rentready',specificItems:'Turnkey unit prep',roughEstimate:'$5,000 - $8,000',status:'Deposit Paid'},{id:705,name:'Sales Referral Job',email:'customer@revitalize.test',address:'Garage Project',mainServices:'garage',specificItems:'Epoxy floor',roughEstimate:'$4,800 - $9,600',status:'Service Scheduled',referralCode:'REVSALE001'}];set(L,sample)}function init(){seed();leads=get(L,[]);progress=get(P,{});sel.innerHTML=leads.length?leads.map((l,i)=>'<option value="'+i+'">'+(l.name||'No name')+' — '+(l.address||'No address')+'</option>').join(''):'<option>No projects found</option>';if(leads.length)load()}function load(){current=leads[Number(sel.value)];if(!current)return;let id=current.id||sel.value;if(!progress[id])progress[id]={id,tasks:taskList(current).map(x=>({text:x,done:false})),notes:''};view.classList.remove('hidden');title.textContent=current.name||'Project';status.textContent=current.status||'New';service.textContent=current.mainServices||'Service';addr.textContent=current.address||'';est.textContent=current.roughEstimate||'';notes.value=progress[id].notes||'';renderTasks()}function renderTasks(){let id=current.id||sel.value,p=progress[id];tasks.innerHTML=p.tasks.map((t,i)=>'<label class="task '+(t.done?'done':'')+'"><input type="checkbox" '+(t.done?'checked':'')+' '+(isAdmin()?'':'disabled')+' onchange="toggle('+i+',this.checked)"><span>'+t.text+'</span></label>').join('');let total=p.tasks.length,done=p.tasks.filter(t=>t.done).length,per=total?Math.round(done/total*100):0;bar.style.width=per+'%';pct.textContent=done+' of '+total+' tasks complete — '+per+'%'}function toggle(i,v){let id=current.id||sel.value;progress[id].tasks[i].done=v;set(P,progress);renderTasks()}function saveNow(){let id=current.id||sel.value;progress[id].notes=notes.value;set(P,progress);alert('Progress saved on this browser. Backend sync still requires deployed backend.')}function resetNow(){if(!isAdmin())return alert('Admin only');let id=current.id||sel.value;progress[id]={id,tasks:taskList(current).map(x=>({text:x,done:false})),notes:''};set(P,progress);load()}init();</script></body></html>
