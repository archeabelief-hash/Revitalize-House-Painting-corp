<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revitalize Admin</title><style>body{font-family:Arial;background:#f7f5ef;margin:0;color:#1b1b1b}main{max-width:1050px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d7d0bf;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 20px #0001}h1,h2{color:#37412f;font-family:Georgia,serif}.btn,button{display:inline-block;background:#37412f;color:white;padding:13px 15px;border-radius:12px;text-decoration:none;font-weight:900;margin:5px;border:0}.light{background:#eef0ea;color:#37412f;border:1px solid #d7d0bf}.gold{background:#b69a55;color:#111}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#fbfaf6;border:1px solid #d7d0bf;border-radius:14px;padding:12px}.metric b{display:block;font-size:24px;color:#37412f}.tab{display:none}.tab.on{display:block}.job{background:#fbfaf6;border:1px solid #d7d0bf;border-radius:14px;padding:12px;margin:10px 0}.pill{display:inline-block;background:#eef0ea;color:#37412f;border:1px solid #d7d0bf;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border:1px solid #d7d0bf;border-radius:10px;min-height:64px;padding:8px;background:#fff;font-weight:900}.event{background:#37412f;color:#fff;border-radius:6px;padding:4px;margin-top:4px;font-size:11px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.cal{grid-template-columns:repeat(4,1fr)}}</style></head><body><main><section class="card"><h1>Revitalize Admin Dashboard</h1><a class="btn gold" href="project.html">Project Progress</a><a class="btn" href="sales-leaderboard.html">Sales Leaderboard</a><a class="btn light" href="portal.html">Portal</a><a class="btn light" href="./">Booking Page</a></section><section class="grid"><div class="metric">Jobs<b id="jobsCount">0</b></div><div class="metric">Estimated Total<b id="totalAmt">$0</b></div><div class="metric">Paid<b id="paidAmt">$0</b></div><div class="metric">Owed<b id="owedAmt">$0</b></div></section><section class="card"><button onclick="showTab('overview')">Overview</button><button onclick="showTab('jobs')">Jobs</button><button onclick="showTab('deposits')">Deposits</button><button onclick="showTab('progress')">Progress</button><button onclick="showTab('calendar')">Calendar</button></section><section id="overview" class="card tab on"><h2>Overview</h2><div id="overviewList"></div></section><section id="jobs" class="card tab"><h2>All Jobs</h2><div id="jobsList"></div></section><section id="deposits" class="card tab"><h2>Deposits / Scheduling</h2><div id="depositsList"></div></section><section id="progress" class="card tab"><h2>Management / Progress</h2><p>Only admin should check off progress tasks.</p><a class="btn gold" href="project.html">Open Progress Tracker</a><div id="progressList"></div></section><section id="calendar" class="card tab"><h2>Calendar View</h2><div id="cal"></div></section></main><script>function get(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function money(n){return '$'+Math.round(Number(n)||0).toLocaleString()}function low(r){let m=String(r||'').match(/\$([0-9,]+)/);return m?Number(m[1].replace(/,/g,'')):0}function bal(j){let t=Number(j.adjustedProjectValue||j.projectValue||low(j.roughEstimate)),p=Number(j.collectedAmount)||0;return{t:t,p:p,o:Math.max(0,t-p)}}function showTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}function row(j){let b=bal(j);return '<div class="job"><b>'+(j.name||'No name')+'</b> <span class="pill">'+(j.status||'New')+'</span><br><b>Address:</b> '+(j.address||'')+'<br><b>Services:</b> '+(j.mainServices||'')+'<br><b>Estimate:</b> '+(j.roughEstimate||'')+'<br><b>Paid:</b> '+money(b.p)+' | <b>Owed:</b> '+money(b.o)+'<br><b>Scheduled:</b> '+(j.scheduledDate||'Not scheduled')+'</div>'}function draw(){let list=get('revitalize_booking_leads');let sum=list.reduce((s,j)=>{let b=bal(j);s.t+=b.t;s.p+=b.p;s.o+=b.o;return s},{t:0,p:0,o:0});jobsCount.textContent=list.length;totalAmt.textContent=money(sum.t);paidAmt.textContent=money(sum.p);owedAmt.textContent=money(sum.o);overviewList.innerHTML=list.slice(0,5).map(row).join('')||'<p>No jobs yet.</p>';jobsList.innerHTML=list.map(row).join('')||'<p>No jobs yet.</p>';depositsList.innerHTML=list.map(j=>'<div class="job"><b>'+(j.name||'No name')+'</b><br>Deposit: '+(j.depositStatus||'Not requested')+'<br>Scheduled: '+(j.scheduledDate||'Not scheduled')+'</div>').join('')||'<p>No deposits yet.</p>';progressList.innerHTML=list.map(j=>'<div class="job"><b>'+(j.name||'No name')+'</b><br>'+(j.address||'')+'<br><a class="btn light" href="project.html">Open Progress</a></div>').join('')||'<p>No projects yet.</p>';let html='<div class="cal">';for(let i=1;i<=31;i++){html+='<div class="day">'+i;list.filter(j=>j.scheduledDate&&new Date(j.scheduledDate).getDate()===i).forEach(j=>{html+='<div class="event">'+(j.mainServices||'Job')+'</div>'});html+='</div>'}cal.innerHTML=html+'</div>'}draw();</script></body></html>
