<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fdab3d">
<title>Revitalize Customer Portal</title>
<style>
:root{--bg:#0e1117;--panel:#151a23;--panel2:#1c2330;--text:#f5f7fb;--muted:#aab4c3;--brand:#fdab3d;--green:#00c875;--red:#e2445c;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,rgba(253,171,61,.16),transparent 36%),var(--bg);color:var(--text);font-family:Arial,system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:16px}.hero,.card{background:rgba(21,26,35,.94);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 12px 34px #0005}.logo{display:inline-grid;place-items:center;width:52px;height:52px;background:var(--brand);color:#111;border-radius:16px;font-weight:900}.brand{display:flex;gap:12px;align-items:center}h1{margin:0;font-size:clamp(1.7rem,5vw,3rem)}p{color:var(--muted);line-height:1.45}.pill{display:inline-flex;gap:8px;align-items:center;border-radius:999px;background:#ffffff12;color:var(--muted);padding:8px 12px}.dot{width:10px;height:10px;border-radius:50%;background:var(--green)}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#10151f;color:var(--text);font:inherit}textarea{min-height:100px}button,.button{border:0;border-radius:12px;padding:11px 14px;background:var(--brand);color:#111;font-weight:900;text-decoration:none;cursor:pointer}.secondary{background:var(--panel2)!important;color:var(--text)!important;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.span4{grid-column:span 4}.span8{grid-column:span 8}.span6{grid-column:span 6}.span12{grid-column:span 12}@media(max-width:760px){.span4,.span8,.span6{grid-column:span 12}}.kv{display:grid;grid-template-columns:140px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.kv span{color:var(--muted);word-break:break-word}.notice{border-left:4px solid var(--brand);background:rgba(253,171,61,.08);padding:12px;border-radius:12px;margin:12px 0;color:var(--muted)}.error{border-left-color:var(--red);background:rgba(226,68,92,.1)}.record{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#ffffff08}.record-title{font-weight:900;margin-bottom:8px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.col{background:#ffffff08;border-radius:10px;padding:8px}.col small{display:block;color:var(--muted);margin-bottom:3px}.hidden{display:none!important}.footer{text-align:center;color:var(--muted);padding:24px}
</style>
</head>
<body data-type="customer">
<main class="app">
<section class="hero"><div class="brand"><div class="logo">RHP</div><div><h1>Customer Project Portal</h1><p>View approved project status, updates, appointments, and links from Revitalize House Painting.</p></div></div><span class="pill"><span class="dot"></span>Customer View</span><div class="controls"><input id="accessInput" placeholder="Access code"><button onclick="saveAndLoad()">Load Portal</button><button class="secondary" onclick="loadPortal()">Refresh</button><button class="secondary" onclick="clearCode()">Clear</button></div><p id="status">Loading shell...</p><div id="err" class="notice error hidden"></div></section>
<section class="grid"><div class="card span4"><h2>Access</h2><div id="accessPanel"></div><div id="links" class="controls"></div><p>Last refreshed: <span id="last">—</span></p></div><div class="card span8"><h2>Your Project</h2><div id="work"></div></div><div class="card span6"><h2>Contact Record</h2><div id="contacts"></div></div><div class="card span6"><h2>Related Updates</h2><div id="related"></div></div><div class="card span12"><h2>Request an Update</h2><textarea id="msg" placeholder="Ask a question or request an update..."></textarea><div class="controls"><button onclick="sendReq()">Send Request</button></div></div></section><footer class="footer">Revitalize House Painting · Powered by Monday</footer>
</main>
<script>
const WORKER='https://rhp-portal-worker.archeabelief.workers.dev';
function qs(n){return new URLSearchParams(location.search).get(n)}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function code(){let c=qs('access')||qs('code')||localStorage.rhp_customer_access||'';if(c)localStorage.rhp_customer_access=c;return c}
function setStatus(t){document.getElementById('status').textContent=t}
function showErr(t){let e=document.getElementById('err');e.classList.remove('hidden');e.textContent=t}
function clearErr(){let e=document.getElementById('err');e.classList.add('hidden');e.textContent=''}
function cols(cols){let blocked=['internal cost','profit','margin','token','secret'];let f=(cols||[]).filter(c=>c.text&&!blocked.some(b=>(c.title||'').toLowerCase().includes(b))&&!(c.title||'').toLowerCase().includes('link to'));return f.length?'<div class="cols">'+f.map(c=>'<div class="col"><small>'+esc(c.title)+'</small><strong>'+esc(c.text)+'</strong></div>').join('')+'</div>':'<p>No visible fields returned yet.</p>'}
function records(list,empty){return list&&list.length?list.map(r=>'<div class="record"><div class="record-title">'+esc(r.name)+'</div>'+(r.url?'<a class="button secondary" target="_blank" href="'+esc(r.url)+'">Open in Monday</a>':'')+'<div style="height:10px"></div>'+cols(r.columns)+'</div>').join(''):'<p>'+esc(empty)+'</p>'}
function render(d){let a=d.access||{};document.getElementById('accessPanel').innerHTML='<div class="kv"><b>Name</b><span>'+esc(a.personName||'—')+'</span></div><div class="kv"><b>Company</b><span>'+esc(a.companyProperty||'—')+'</span></div><div class="kv"><b>Type</b><span>'+esc(a.userType||'—')+'</span></div><div class="kv"><b>Status</b><span>'+esc(a.status||'—')+'</span></div><div class="kv"><b>Notes</b><span>'+esc(a.notes||'—')+'</span></div>';let links=[];if(a.dataViewLink&&a.dataViewLink.url)links.push('<a class="button secondary" target="_blank" href="'+esc(a.dataViewLink.url)+'">Open Data View</a>');if(a.submitLink&&a.submitLink.url)links.push('<a class="button secondary" target="_blank" href="'+esc(a.submitLink.url)+'">Submit Request</a>');document.getElementById('links').innerHTML=links.join(' ');document.getElementById('contacts').innerHTML=records(d.contacts,'No linked contact record.');document.getElementById('work').innerHTML=records(d.workItems,'No linked project/work record yet.');document.getElementById('related').innerHTML=records(d.relatedItems,'No related records returned yet.');document.getElementById('last').textContent=new Date().toLocaleString()}
async function loadPortal(){clearErr();let c=code();document.getElementById('accessInput').value=c;if(!c){setStatus('Enter your access code to load the portal.');return}setStatus('Refreshing Monday data...');try{let r=await fetch(WORKER+'/portal?access='+encodeURIComponent(c)+'&type=customer&t='+Date.now(),{cache:'no-store'});let d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Portal failed to load');render(d);setStatus('Live data loaded from Monday.')}catch(e){setStatus('Could not load portal data.');showErr(e.message)}}
function saveAndLoad(){let v=document.getElementById('accessInput').value.trim();if(v)localStorage.rhp_customer_access=v;loadPortal()}
function clearCode(){delete localStorage.rhp_customer_access;location.href=location.pathname}
async function sendReq(){let c=code(),m=document.getElementById('msg').value.trim();if(!c||!m)return alert('Access code and message required.');let r=await fetch(WORKER+'/portal/request-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access:c,type:'customer',message:m})});let d=await r.json();if(!r.ok||!d.ok)return alert(d.error||'Request failed');document.getElementById('msg').value='';alert('Request sent to Revitalize for review.')}
loadPortal();
</script>
</body></html>
