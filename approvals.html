<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approvals</title><style>body{font-family:Arial;background:#f7f5ef;margin:0;color:#1b1b1b}main{max-width:1050px;margin:auto;padding:16px}.card{background:white;border:1px solid #d7d0bf;border-radius:18px;padding:18px;margin:14px 0}h1,h2{color:#37412f}.btn{display:inline-block;background:#37412f;color:white;padding:12px 14px;border-radius:12px;text-decoration:none;margin:5px;font-weight:900}.gold{background:#b69a55;color:#111}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#fbfaf6;border:1px solid #d7d0bf;border-radius:14px;padding:12px}.metric b{display:block;font-size:24px;color:#37412f}.job{background:#fbfaf6;border:1px solid #d7d0bf;border-radius:14px;padding:12px;margin:10px 0}input{width:100%;padding:13px;border-radius:12px;border:1px solid #bbb}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="card"><h1>Revitalize Approvals</h1><p id="status">Loading...</p><a class="btn" href="./">Main</a><a class="btn" href="project-monday.html">Project</a><a class="btn gold" href="https://wa.me/15739089506" target="_blank">WhatsApp</a></section><section class="grid"><div class="metric">Items<b id="count">0</b></div><div class="metric">Value<b id="value">$0</b></div><div class="metric">Records<b id="records">0</b></div><div class="metric">Hickory<b>$4,332</b></div></section><section class="card"><input id="q" oninput="render()" placeholder="Search approvals"><div id="list"></div></section></main><script>const API='https://rhp-portal-worker.archeabelief.workers.dev/company-data';let D=null;const money=n=>'$'+Number(n||0).toLocaleString();const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');const local=[{name:'811 Hickory Known Kitchen Subtotal',status:'Needs Approval',amount:4332.49,details:'Known materials plus cabinet labor only.'},{name:'Menards Kitchen Package',status:'Needs Approval',amount:2225.99,details:'Tax labor delivery not included.'},{name:'Marked Up Material Charge',status:'Needs Approval',amount:2782.49,details:'Material plus markup.'},{name:'Cabinet Install Labor',status:'Needs Approval',amount:1550,details:'Cabinet installation labor.'},{name:'Open Scope Items',status:'Needs Review',amount:0,details:'Countertop labor, plumbing, fans, doors, floors, ceiling, paint measurements.'}];function hay(x){return JSON.stringify(x||{}).toLowerCase()}function items(){let t=D?.tabs||{};let m=[].concat(t.overview||[],t.projects||[],t.materials||[],t.quotes||[],t.pricing||[]).filter(x=>/approval|review|pending|quote|estimate|material|pricing/i.test(hay(x)));return local.concat(m)}function card(x){return '<div class="job"><b>'+esc(x.name||x.contact||'No name')+'</b><br>Status: '+esc(x.status||x.boardName||'Approval')+'<br>'+(x.amount?'Amount: '+money(x.amount)+'<br>':'')+esc(x.details||x.address||'')+(x.url?'<br><a class="btn" target="_blank" href="'+esc(x.url)+'">Open</a>':'')+'</div>'}function render(){let s=(q.value||'').toLowerCase();let a=items().filter(x=>!s||hay(x).includes(s));list.innerHTML=a.map(card).join('')||'<p>No records.</p>';count.textContent=a.length;value.textContent=money(a.reduce((p,x)=>p+(Number(x.amount)||0),0))}async function load(){try{let r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});D=await r.json();records.textContent=D.metrics?.records||0;status.textContent='Loaded Monday data';render()}catch(e){D={tabs:{}};records.textContent='0';status.textContent='Showing local approval pack';render()}}load();</script></body></html>
