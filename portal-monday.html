<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revitalize Portal</title><style>body{font-family:Arial;background:#f7f5ef;margin:0;color:#1b1b1b}main{max-width:980px;margin:auto;padding:16px}.card{background:white;border:1px solid #d7d0bf;border-radius:18px;padding:16px;margin:12px 0}h1,h2{color:#37412f}.btn,button{background:#37412f;color:white;border:0;border-radius:12px;padding:12px;margin:5px;text-decoration:none}.gold{background:#b69a55;color:#111}.job{background:#fbfaf6;border:1px solid #d7d0bf;border-radius:14px;padding:12px;margin:10px 0}.pill{background:#eef0ea;border-radius:999px;padding:4px 8px;margin:2px;display:inline-block}input{width:100%;padding:12px;border-radius:12px;border:1px solid #bbb}</style></head><body><main><section class="card"><h1>Revitalize Live Portal</h1><p id="status">Loading Monday data...</p><a class="btn" href="./">Booking</a><a class="btn" href="admin-monday.html">Admin</a><a class="btn" href="project-monday.html">Projects</a><button class="gold" onclick="loadData()">Refresh</button></section><section class="card"><input id="q" oninput="render()" placeholder="Search live Monday records"></section><section class="card"><h2>Projects</h2><div id="projects"></div></section><section class="card"><h2>Schedule</h2><div id="schedule"></div></section><section class="card"><h2>Files</h2><div id="files"></div></section></main><script>const API='https://rhp-portal-worker.archeabelief.workers.dev/company-data';let D=null;function e(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function f(a){let s=(q.value||'').toLowerCase();return(a||[]).filter(x=>!s||JSON.stringify(x).toLowerCase().includes(s))}function card(x){return '<div class="job"><b>'+e(x.contact||x.name)+'</b><br><span class="pill">'+e(x.status||x.boardName||'Monday')+'</span><br>'+e(x.address||x.itemName||'')+'<br>'+(x.url?'<a class="btn" target="_blank" href="'+e(x.url)+'">Open</a>':'')+(x.itemUrl?'<a class="btn" target="_blank" href="'+e(x.itemUrl)+'">Related</a>':'')+'</div>'}function render(){if(!D)return;let t=D.tabs||{};projects.innerHTML=f(t.projects).map(card).join('')||'<p>No projects.</p>';schedule.innerHTML=f(t.schedule).map(card).join('')||'<p>No schedule.</p>';files.innerHTML=f(t.files).map(card).join('')||'<p>No files exposed yet.</p>'}async function loadData(){status.textContent='Syncing...';try{let r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});D=await r.json();if(!D.ok)throw Error(D.error||'failed');status.textContent='Loaded '+(D.metrics.records||0)+' Monday records';render()}catch(err){status.textContent='Sync issue: '+err.message}}loadData();</script></body></html>
