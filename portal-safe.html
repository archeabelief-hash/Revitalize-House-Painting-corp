<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revitalize Portal</title><style>body{font-family:Arial;margin:0;background:#f7f5ef;color:#1b1b1b}main{max-width:1050px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d7d0bf;border-radius:18px;padding:16px;margin:12px 0}h1{font-family:Georgia,serif;color:#37412f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,select{width:100%;padding:12px;border:1px solid #bbb;border-radius:12px}.btn,button{display:inline-block;margin:5px;padding:12px 14px;border-radius:12px;background:#37412f;color:#fff;border:0;text-decoration:none;font-weight:900}.light{background:#eef0ea;color:#37412f;border:1px solid #d7d0bf}.gold{background:#b69a55;color:#111}.hidden{display:none}.pill{display:inline-block;background:#eef0ea;color:#37412f;border:1px solid #d7d0bf;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800}.metric{background:#fbfaf6;border:1px solid #d7d0bf;border-radius:14px;padding:12px}.metric b{display:block;color:#37412f;font-size:24px}.barbox{height:16px;background:#eee;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(135deg,#37412f,#b69a55)}.money{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.money div{background:#fbfaf6;border:1px solid #d7d0bf;border-radius:10px;padding:8px}@media(max-width:760px){.grid,.three,.cards,.money{grid-template-columns:1fr}}</style></head><body><main><section class="card"><h1>Revitalize Portal</h1><p>Role-safe client and sales portal.</p><a class="btn light" href="./">Booking Page</a></section><section id="auth" class="grid"><div class="card"><h2>Log In</h2><form onsubmit="event.preventDefault();login()"><input id="email" placeholder="customer@revitalize.test"><br><br><input id="pw" type="password" placeholder="admin2026"><br><br><button>Log In</button></form><p id="msg"></p><div id="quick"></div></div><div class="card"><h2>Create Account</h2><input id="newname" placeholder="Name"><br><br><input id="newemail" placeholder="Email"><br><br><input id="newpw" type="password" placeholder="Password"><br><br><select id="newtype"><option value="customer">Customer</option><option value="property_manager">Property Manager</option><option value="realtor">Realtor</option><option value="landlord">Landlord</option><option value="sales_agent">Sales Agent</option></select><br><br><button class="gold" onclick="createAcct()">Create Account</button></div></section><section id="dash" class="hidden"><div class="card"><h2 id="hello"></h2><span id="role" class="pill"></span> <span id="tag" class="pill"></span><br><button class="light" onclick="logout()">Logout</button><a id="newjob" class="btn gold">Submit New Project</a><a class="btn light" href="project.html">Project Progress</a><a id="leader" class="btn light hidden" href="sales-leaderboard.html">Sales Leaderboard</a></div><div class="three"><div class="metric"><span id="l1"></span><b id="v1"></b></div><div class="metric"><span id="l2"></span><b id="v2"></b></div><div class="metric"><span id="l3"></span><b id="v3"></b></div></div><div id="quickSchedule" class="card hidden"><h2>Quick Schedule</h2><a class="btn gold" href="./?quick=rentready">Rent-Ready</a><a class="btn" href="./?quick=painting">Painting</a><a class="btn" href="./?quick=handyman">Handyman</a><a class="btn" href="./?quick=pressure">Pressure Washing</a></div><section class="card"><h2>Project Cards</h2><div id="projects"></div></section></section></main><script>const A='revitalize_accounts',S='revitalize_portal_session',L='revitalize_booking_leads',P='revitalize_project_progress',PASS='admin2026',TOKEN=.05,COMM=.10;const defs=[['customer','Customer Test','customer@revitalize.test',''],['property_manager','Property Manager Test','propertymanager@revitalize.test',''],['realtor','Realtor Test','realtor@revitalize.test',''],['landlord','Landlord Test','landlord@revitalize.test',''],['sales_agent','Sales Agent Test','salesagent@revitalize.test','REVSALE001']].map((x,i)=>({id:900+i,type:x[0],name:x[1],email:x[2],password:PASS,referralCode:x[3],status:'active'}));function get(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}function money(n){return '$'+Math.round(Number(n)||0).toLocaleString()}function low(r){let m=String(r||'').match(/\$([0-9,]+)/);return m?Number(m[1].replace(/,/g,'')):0}function seed(){let ac=get(A,[]),changed=false;defs.forEach(x=>{if(!ac.some(y=>y.email===x.email)){ac.push(x);changed=true}});if(changed)set(A,ac);let leads=get(L,[]);if(!leads.some(x=>x.id===701)){set(L,[mk(701,defs[0],'interior','Walls and trim','$2,000 - $3,500','Quote Scheduled',{paid:500}),mk(702,defs[1],'rentready','Turnkey unit prep','$5,000 - $8,000','Deposit Paid',{paid:2500,discount:true}),mk(703,defs[2],'pressure, handyman','Pre-listing punch list','$1,500 - $2,800','Needs Follow-Up',{}),mk(704,defs[3],'handyman, drywall','Rental repairs','$1,400 - $2,700','Deposit Pending',{discount:true}),mk(705,defs[0],'garage','Garage coating','$4,800 - $9,600','Service Scheduled',{paid:4800,ref:'REVSALE001',comPaid:150})].concat(leads))}}function mk(id,a,svc,it,range,status,e){let full=low(range),disc=(a.type==='property_manager'||a.type==='landlord'||e.discount)?Math.round(full*.5):full;return{id,status,name:a.name,email:a.email,customerType:a.type,address:a.name+' Project',mainServices:svc,specificItems:it,roughEstimate:range,projectValue:full,adjustedProjectValue:disc,industryDiscount:disc<full,collectedAmount:e.paid||0,commissionPaid:e.comPaid||0,referralCode:e.ref||''}}function accts(){return get(A,[])}function cur(){return accts().find(x=>String(x.id)===localStorage.getItem(S))}function leads(){return get(L,[])}function mine(a){return a.type==='sales_agent'?leads().filter(x=>x.referralCode===a.referralCode):leads().filter(x=>(x.email||'').toLowerCase()===a.email)}function bal(x){let total=Number(x.adjustedProjectValue||x.projectValue||low(x.roughEstimate)),paid=+x.collectedAmount||0;return{total,paid,owed:Math.max(0,total-paid),paidOff:paid>=total&&total>0}}function pct(id){let p=get(P,{})[id];return !p?.tasks?.length?0:Math.round(p.tasks.filter(t=>t.done).length/p.tasks.length*100)}function login(){seed();let a=accts().find(x=>x.email===email.value.trim().toLowerCase()&&x.password===pw.value);if(!a){msg.textContent='Wrong login.';return}localStorage.setItem(S,a.id);render()}function logout(){localStorage.removeItem(S);render()}function createAcct(){let ac=accts(),a={id:Date.now(),name:newname.value,email:newemail.value.toLowerCase(),password:newpw.value,type:newtype.value,status:'active',referralCode:newtype.value==='sales_agent'?'REV'+String(Date.now()).slice(-6):''};ac.push(a);set(A,ac);localStorage.setItem(S,a.id);render()}function renderQuick(){quick.innerHTML=defs.map(d=>'<button class="light" onclick="email.value=\''+d.email+'\';pw.value=\''+PASS+'\'">'+d.type.replace('_',' ')+'</button>').join('')}function render(){seed();renderQuick();let a=cur();auth.classList.toggle('hidden',!!a);dash.classList.toggle('hidden',!a);if(!a)return;let list=mine(a),isSales=a.type==='sales_agent',paid=list.reduce((s,x)=>s+bal(x).paid,0),owed=list.reduce((s,x)=>s+bal(x).owed,0),earned=list.reduce((s,x)=>s+(+x.collectedAmount||bal(x).total)*COMM,0),comPaid=list.reduce((s,x)=>s+(+x.commissionPaid||0),0);hello.textContent='Welcome, '+a.name;role.textContent=a.type.replace('_',' ').toUpperCase();tag.textContent=isSales?'Referral '+a.referralCode:(a.type==='customer'?'5% Rewards':'Account');leader.classList.toggle('hidden',!isSales);quickSchedule.classList.toggle('hidden',!['property_manager','realtor','landlord'].includes(a.type));newjob.href=isSales?'./?ref='+a.referralCode:'./?acct='+encodeURIComponent(a.email);v1.textContent=list.length;if(isSales){l1.textContent='Referred Jobs';l2.textContent='Commission Earned';l3.textContent='Paid / Balance';v2.textContent=money(earned);v3.textContent=money(comPaid)+' / '+money(earned-comPaid)}else if(a.type==='customer'){l1.textContent='Projects';l2.textContent='5% Reward Credits';l3.textContent='Balance Owed';v2.textContent=money(paid*TOKEN);v3.textContent=money(owed)}else{l1.textContent='Active Projects';l2.textContent='Balance Paid';l3.textContent='Balance Owed';v2.textContent=money(paid);v3.textContent=money(owed)}projects.innerHTML='<div class="cards">'+list.map(x=>{let b=bal(x),c=pct(x.id);return '<div class="card"><h3>'+x.address+'</h3><span class="pill">'+x.status+'</span><span class="pill">'+(b.paidOff?'Paid Off':'Balance Owed')+'</span>'+(x.industryDiscount?'<span class="pill">50% industry pricing</span>':'')+'<div class="barbox"><div class="bar" style="width:'+c+'%"></div></div><p><b>'+c+'% complete</b></p><p>'+x.mainServices+'<br>'+x.specificItems+'</p>'+(isSales?'<div class="money"><div>Earned<b>'+money((+x.collectedAmount||b.total)*COMM)+'</b></div><div>Paid<b>'+money(x.commissionPaid||0)+'</b></div><div>Balance<b>'+money(((+x.collectedAmount||b.total)*COMM)-(+x.commissionPaid||0))+'</b></div></div>':'<div class="money"><div>Total<b>'+money(b.total)+'</b></div><div>Paid<b>'+money(b.paid)+'</b></div><div>Owed<b>'+money(b.owed)+'</b></div></div>'+(a.type==='customer'?'<p><b>5% Reward Credits:</b> '+money(b.paid*TOKEN)+'</p>':''))+'</div>'}).join('')+'</div>'}render();</script></body></html>
