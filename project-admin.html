<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Project Progress</title><style>body{margin:0;font-family:Arial;background:#f7f5ef;color:#1b1b1b}main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d7d0bf;border-radius:18px;padding:16px;margin:12px 0}h1,h2{color:#37412f}.btn,button{border:0;border-radius:12px;padding:12px 14px;background:#37412f;color:#fff;font-weight:900;text-decoration:none;display:inline-block;margin:5px}.light{background:#eef0ea;color:#37412f;border:1px solid #d7d0bf}.gold{background:#b69a55;color:#111}select,textarea{width:100%;padding:12px;border:1px solid #bbb;border-radius:12px;font-size:16px}.task{display:flex;gap:10px;background:#fbfaf6;border:1px solid #d7d0bf;border-radius:12px;padding:10px;margin:8px 0}.task input{width:24px;height:24px}.done{text-decoration:line-through;opacity:.6}.barbox{height:20px;background:#eee;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(135deg,#37412f,#b69a55)}.pill{display:inline-block;background:#eef0ea;border:1px solid #d7d0bf;border-radius:999px;padding:5px 8px;margin:2px;font-size:12px;font-weight:900}</style></head><body><main><section class="card"><h1>Admin Progress Editor</h1><p>Use this page to update project progress. Changes save to this site's project progress storage.</p><a class="btn light" href="admin.html">Admin Dashboard</a><a class="btn light" href="portal.html">Portal</a></section><section class="card"><h2>Select Project</h2><select id="sel" onchange="loadProject()"></select></section><section class="card"><h2 id="title">Project</h2><span id="status" class="pill"></span><span id="svc" class="pill"></span><p id="addr"></p><div class="barbox"><div id="bar" class="bar"></div></div><p id="pct"></p></section><section class="card"><h2>Tasks</h2><div id="tasks"></div><button class="gold" onclick="saveAll()">Save Progress</button><button class="light" onclick="resetTasks()">Reset Tasks</button></section><section class="card"><h2>Notes</h2><textarea id="notes"></textarea><button onclick="saveAll()">Save Notes</button></section></main><script>const L='revitalize_booking_leads',P='revitalize_project_progress';let leads=[],progress={},current=null;const base=['Request received','Scope reviewed','Deposit/schedule updated','Materials planned','Work started','Quality check','Final walkthrough'];const taskMap={interior:['Confirm colors','Protect floors','Patch holes','Sand/prep','Prime repairs','Paint coat 1','Paint coat 2','Cleanup','Final walkthrough'],exterior:['Inspect exterior','Wash','Scrape/sand','Caulk','Prime','Paint siding/trim','Cleanup','Final walkthrough'],rentready:['Move-out walkthrough','Trash removal','Locks/safety','Repairs','Paint/touch-up','Deep clean','Final inspection'],handyman:['Confirm punch list','Gather materials','Complete repair/install','Test work','Cleanup','Final walkthrough'],pressure:['Protect outlets/plants','Apply cleaner','Wash','Rinse','Inspect','Cleanup'],garage:['Inspect concrete','Prep/grind','Repair cracks','Base coat','Broadcast chips','Top coat','Cure','Final walkthrough']};function get(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}function seed(){if(get(L,[]).length)return;set(L,[{id:701,name:'Customer Test',address:'Customer Project',mainServices:'interior',status:'Quote Scheduled'},{id:702,name:'Property Manager Test',address:'PM Unit 12',mainServices:'rentready',status:'Deposit Paid'},{id:705,name:'Sales Referral Job',address:'Garage Project',mainServices:'garage',status:'Service Scheduled'}])}function tasksFor(j){let t=((j.mainServices||'')+' '+(j.specificItems||'')).toLowerCase();let out=[];Object.keys(taskMap).forEach(k=>{if(t.includes(k)||k==='pressure'&&t.includes('wash')||k==='rentready'&&t.includes('turn'))out=out.concat(taskMap[k])});return [...new Set(out.length?out:base)]}function init(){seed();leads=get(L,[]);progress=get(P,{});sel.innerHTML=leads.map((j,i)=>'<option value="'+i+'">'+(j.name||'No name')+' - '+(j.address||'')+'</option>').join('');loadProject()}function loadProject(){current=leads[Number(sel.value)]||leads[0];let id=current.id||sel.value;if(!progress[id])progress[id]={id:id,tasks:tasksFor(current).map(x=>({text:x,done:false})),notes:''};title.textContent=current.name||'Project';status.textContent=current.status||'New';svc.textContent=current.mainServices||'Service';addr.textContent=current.address||'';notes.value=progress[id].notes||'';renderTasks()}function renderTasks(){let id=current.id||sel.value,p=progress[id];tasks.innerHTML=p.tasks.map((t,i)=>'<label class="task '+(t.done?'done':'')+'"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggleTask('+i+',this.checked)"><span>'+t.text+'</span></label>').join('');let done=p.tasks.filter(t=>t.done).length,total=p.tasks.length,per=total?Math.round(done/total*100):0;bar.style.width=per+'%';pct.textContent=done+' of '+total+' complete - '+per+'%'}function toggleTask(i,v){let id=current.id||sel.value;progress[id].tasks[i].done=v;set(P,progress);renderTasks()}function saveAll(){let id=current.id||sel.value;progress[id].notes=notes.value;set(P,progress);alert('Progress saved.')}function resetTasks(){let id=current.id||sel.value;progress[id]={id:id,tasks:tasksFor(current).map(x=>({text:x,done:false})),notes:''};set(P,progress);loadProject()}init();</script></body></html>
