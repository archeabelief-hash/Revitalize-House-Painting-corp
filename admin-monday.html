<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revitalize Monday Admin</title><style>body{font-family:Arial;background:#f7f5ef;margin:0;color:#1b1b1b}main{max-width:1100px;margin:auto;padding:18px}.card{background:white;border:1px solid #d7d0bf;border-radius:18px;padding:18px;margin:14px 0}h1,h2{color:#37412f;font-family:Georgia,serif}.btn,button{background:#37412f;color:white;padding:12px 14px;border-radius:12px;margin:5px;border:0;text-decoration:none;font-weight:900}.gold{background:#b69a55;color:#111}.light{background:#eef0ea;color:#37412f;border:1px solid #d7d0bf}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#fbfaf6;border:1px solid #d7d0bf;border-radius:14px;padding:12px}.metric b{display:block;font-size:24px;color:#37412f}.tab{display:none}.tab.on{display:block}.job{background:#fbfaf6;border:1px solid #d7d0bf;border-radius:14px;padding:12px;margin:10px 0}.pill{display:inline-block;background:#eef0ea;color:#37412f;border:1px solid #d7d0bf;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900;margin:2px}input{width:100%;padding:13px;border-radius:12px;border:1px solid #bbb}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border:1px solid #d7d0bf;border-radius:10px;min-height:70px;padding:8px;background:white}.event{background:#37412f;color:white;border-radius:6px;padding:4px;margin-top:4px;font-size:11px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.cal{grid-template-columns:repeat(4,1fr)}}</style></head><body><main><section class="card"><h1>Revitalize Admin Dashboard</h1><p id="status">Loading Monday data...</p><button class="gold" onclick="loadData()">Refresh Monday Data</button><a class="btn light" href="./">Booking Page</a><a class="btn light" href="portal.html">Portal</a><a class="btn light" href="project.html">Progress</a></section><section class="grid"><div class="metric">Records<b id="records">0</b></div><div class="metric">Clients<b id="clients">0</b></div><div class="metric">Projects<b id="projects">0</b></div><div class="metric">Pipeline<b id="pipeline">$0</b></div></section><section class="card"><input id="search" oninput="render()" placeholder="Search Monday data"><br><br><button onclick="tab('overview')">Overview</button><button onclick="tab('jobs')">Jobs</button><button onclick="tab('accounts')">Accounts</button><button onclick="tab('schedule')">Calendar</button><button onclick="tab('materials')">Materials</button><button onclick="tab('files')">Files</button><button onclick="tab('pricing')">Pricing</button><button onclick="tab('all')">All</button></section><section id="overview" class="card tab on"><h2>Overview</h2><div id="overviewList"></div></section><section id="jobs" class="card tab"><h2>Jobs</h2><div id="jobsList"></div></section><section id="accounts" class="card tab"><h2>Accounts</h2><div id="accountsList"></div></section><section id="schedule" class="card tab"><h2>Calendar</h2><div id="scheduleList"></div><div id="cal"></div></section><section id="materials" class="card tab"><h2>Materials</h2><div id="materialsList"></div></section><section id="files" class="card tab"><h2>Files</h2><div id="filesList"></div></section><section id="pricing" class="card tab"><h2>Pricing</h2><div id="pricingList"></div></section><section id="all" class="card tab"><h2>All Records</h2><div id="allList"></div></section></main><script>const API='https://rhp-portal-worker.archeabelief.workers.dev/company-data';let D=null;let ACTIVE='overview';function money(n){return '$'+Math.round(Number(n)||0).toLocaleString()}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function tab(id){ACTIVE=id;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');render()}function fields(x){return (x.fields||[]).slice(0,6).map(f=>'<br><small><b>'+esc(f.title)+':</b> '+esc(f.text)+'</small>').join('')}function card(x){if(ACTIVE==='files')return '<div class="job"><b>'+esc(x.name)+'</b><br><span class="pill">'+esc(x.boardName)+'</span><span class="pill">'+esc(x.itemName)+'</span><br>'+(x.url?'<a class="btn gold" target="_blank" href="'+esc(x.url)+'">Open / Download</a>':'')+(x.itemUrl?'<a class="btn light" target="_blank" href="'+esc(x.itemUrl)+'">Related Record</a>':'')+'</div>';return '<div class="job"><b>'+esc(x.contact||x.name||'No name')+'</b> <span class="pill">'+esc(x.status||'Monday')+'</span><span class="pill">'+esc(x.boardName||'')+'</span><br><b>Address:</b> '+esc(x.address||'')+'<br><b>Record:</b> '+esc(x.name||'')+'<br>'+(x.date?'<b>Date:</b> '+esc(x.date)+'<br>':'')+(x.amount?'<b>Amount:</b> '+money(x.amount)+'<br>':'')+(x.url?'<a class="btn light" target="_blank" href="'+esc(x.url)+'">Open in Monday</a>':'')+fields(x)+'</div>'}function list(id,arr){let q=(search.value||'').toLowerCase();let a=(arr||[]).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));document.getElementById(id).innerHTML=a.map(card).join('')||'<p>No records found.</p>'}function render(){if(!D)return;let t=D.tabs||{};list('overviewList',t.overview);list('jobsList',t.projects);list('accountsList',t.clients);list('scheduleList',t.schedule);list('materialsList',t.materials);list('filesList',t.files);list('pricingList',t.quotes);list('allList',t.all);let html='<div class="cal">';for(let i=1;i<=31;i++){html+='<div class="day">'+i;(t.schedule||[]).filter(x=>x.date&&new Date(x.date).getDate()===i).forEach(x=>html+='<div class="event">'+esc(x.name)+'</div>');html+='</div>'}cal.innerHTML=html+'</div>'}async function loadData(){status.textContent='Syncing Monday data...';try{let r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});D=await r.json();if(!D.ok)throw Error(D.error||'Data failed');localStorage.setItem('revitalize_monday_cache',JSON.stringify(D));records.textContent=D.metrics.records||0;clients.textContent=D.metrics.clients||0;projects.textContent=D.metrics.projects||0;pipeline.textContent=money(D.metrics.pipeline||0);status.textContent='Monday synced: '+(D.metrics.records||0)+' records';render()}catch(e){status.textContent='Sync issue: '+e.message;let c=localStorage.getItem('revitalize_monday_cache');if(c){D=JSON.parse(c);render()}}}loadData();</script></body></html>
