<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revitalize Admin</title><style>body{font-family:Arial;background:#f7f5ef;margin:0;color:#1b1b1b}main{max-width:1000px;margin:auto;padding:18px}.card{background:white;border:1px solid #d7d0bf;border-radius:18px;padding:18px;margin:14px 0}h1,h2{color:#37412f}.btn,button{background:#37412f;color:white;padding:12px 14px;border-radius:12px;margin:5px;border:0;text-decoration:none;font-weight:900}.gold{background:#b69a55;color:#111}.job{background:#fbfaf6;border:1px solid #d7d0bf;border-radius:14px;padding:12px;margin:10px 0}.pill{display:inline-block;background:#eef0ea;border-radius:999px;padding:4px 8px;margin:2px}</style></head><body><main><section class="card"><h1>Revitalize Admin</h1><p id="status">Loading Monday data...</p><a class="btn gold" href="live.html">Live OS</a><a class="btn" href="project-monday.html">Projects</a><a class="btn" href="portal-monday.html">Portal</a></section><section class="card"><h2>Records</h2><div id="list"></div></section></main><script>fetch('https://rhp-portal-worker.archeabelief.workers.dev/company-data?t='+Date.now()).then(r=>r.json()).then(d=>{status.textContent='Loaded '+(d.metrics.records||0)+' Monday records';let a=(d.tabs.all||[]).slice(0,80);list.innerHTML=a.map(x=>'<div class="job"><b>'+String(x.contact||x.name||'Record')+'</b><br><span class="pill">'+String(x.status||x.boardName||'Monday')+'</span><br>'+String(x.address||'')+(x.url?'<br><a class="btn" target="_blank" href="'+x.url+'">Open in Monday</a>':'')+'</div>').join('')||'<p>No records.</p>'}).catch(e=>status.textContent='Data issue: '+e.message)</script></body></html>
