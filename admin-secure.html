<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Owner Admin</title><style>body{font-family:Arial;margin:0;background:#f7f5ef;color:#1b1b1b}main{max-width:1050px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d7d0bf;border-radius:18px;padding:16px;margin:12px 0}h1{font-family:Georgia,serif;color:#37412f}.btn,button{padding:12px 14px;border:0;border-radius:12px;background:#37412f;color:#fff;font-weight:900;text-decoration:none;display:inline-block;margin:5px}.light{background:#eef0ea;color:#37412f;border:1px solid #d7d0bf}.gold{background:#b69a55;color:#111}input{width:100%;padding:12px;border:1px solid #bbb;border-radius:12px}.hidden{display:none}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:#fff;border:1px solid #d7d0bf;border-radius:8px;min-height:65px;padding:8px;font-size:12px}.event{background:#37412f;color:white;border-radius:6px;padding:4px;margin-top:4px}</style></head><body><main><section id='login' class='card'><h1>Owner Admin Login</h1><form onsubmit='event.preventDefault();go()'><input id='u' placeholder='revitalize'><br><br><input id='p' type='password' placeholder='admin2026'><br><br><button class='gold'>Log In</button></form><p id='e'></p><a class='btn light' href='portal.html'>Back to Portal</a></section><section id='dash' class='hidden'><div class='card'><h1>Admin Dashboard</h1><button class='light' onclick='out()'>Logout</button><a class='btn' href='sales-leaderboard.html'>Sales Leaderboard</a><a class='btn light' href='project-live.html'>Live Progress</a><a class='btn light' href='./'>Booking</a></div><div class='card'><h2>Calendar View</h2><p>This calendar shows projects saved in this system by scheduled date. Google Calendar auto-write requires backend OAuth integration next.</p><div id='cal' class='cal'></div></div></section></main><script>const K='revitalize_admin_logged_in';function go(){if(u.value==='revitalize'&&p.value==='admin2026'){localStorage.setItem(K,'yes');r()}else e.textContent='Wrong owner login'}function out(){localStorage.removeItem(K);r()}function r(){let ok=localStorage.getItem(K)==='yes';login.classList.toggle('hidden',ok);dash.classList.toggle('hidden',!ok);if(ok)c()}function c(){let leads=JSON.parse(localStorage.getItem('revitalize_booking_leads')||'[]');cal.innerHTML='';for(let i=1;i<=31;i++){let d=document.createElement('div');d.className='day';d.innerHTML='<b>'+i+'</b>';leads.filter(x=>x.scheduledDate&&new Date(x.scheduledDate).getDate()===i).forEach(x=>{let ev=document.createElement('div');ev.className='event';ev.textContent=(x.mainServices||'Job')+' '+(x.name||'');d.appendChild(ev)});cal.appendChild(d)}}r()</script></body></html>
