<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revitalize Test Data</title><style>body{font-family:Arial,sans-serif;background:#f7f5ef;color:#1b1b1b;margin:0;padding:18px}main{max-width:900px;margin:auto}.card{background:#fff;border:1px solid #d7d0bf;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 22px #0001}button,a{display:inline-block;margin:6px 6px 6px 0;padding:12px 14px;border-radius:12px;border:0;background:#37412f;color:#fff;font-weight:900;text-decoration:none}.gold{background:#b69a55;color:#111}code{background:#eef0ea;padding:2px 5px;border-radius:5px}.row{border-bottom:1px solid #eee;padding:10px 0}</style></head><body><main><section class="card"><h1>Revitalize Full Test Data Loader</h1><p>This creates one account for every portal type and one project under each account so you can test dashboards, jobs, deposits, management, progress, and commissions.</p><button class="gold" onclick="seedAll()">Create All Test Accounts + Jobs</button><a href="portal.html">Open Portal</a><a href="admin.html">Open Admin</a><a href="project.html">Open Progress</a></section><section class="card"><h2>Test Logins</h2><div id="list"></div></section></main><script>const ACC='revitalize_accounts',LEADS='revitalize_booking_leads',AGENTS='revitalize_sales_agents',PROGRESS='revitalize_project_progress';const pass='admin2026';const accounts=[{id:9001,name:'Revitalize Admin Test',phone:'573-908-9748',email:'admin@revitalize.test',password:pass,type:'admin',focus:'Owner management',status:'active',referralCode:''},{id:9002,name:'Customer Test Account',phone:'573-555-2002',email:'customer@revitalize.test',password:pass,type:'customer',focus:'Homeowner services',status:'active',referralCode:''},{id:9003,name:'Property Manager Test',phone:'573-555-2003',email:'propertymanager@revitalize.test',password:pass,type:'property_manager',focus:'Turnkey rent-ready',status:'active',referralCode:''},{ tringify(progress));alert('Created all account-type test accounts and jobs. Use admin2026 as the password for every portal test account.');render()}function render(){document.getElementById('list').innerHTML=accounts.map(a=>`<div class="row"><b>${a.type}</b><br>Email: <code>${a.email}</code><br>Password: <code>${pass}</code>${a.referralCode?`<br>Referral Code: <code>${a.referralCode}</code>`:''}</div>`).join('')}render();</script></body></html>
