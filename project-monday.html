<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revitalize Projects</title><style>body{font-family:Arial;background:#f7f5ef;margin:0;color:#1b1b1b}main{max-width:1000px;margin:auto;padding:18px}.card{background:white;border:1px solid #d7d0bf;border-radius:18px;padding:18px;margin:14px 0}h1,h2{color:#37412f}.btn{background:#37412f;color:white;padding:12px 14px;border-radius:12px;margin:5px;text-decoration:none;font-weight:900;display:inline-block}.gold{background:#b69a55;color:#111}.job{background:#fbfaf6;border:1px solid #d7d0bf;border-radius:14px;padding:12px;margin:10px 0}.pill{display:inline-block;background:#eef0ea;border-radius:999px;padding:4px 8px;margin:2px}</style></head><body><main><section class="card"><h1>Revitalize Projects</h1><p id="status">Loading Monday projects...</p><a class="btn gold" href="live.html">Live OS</a><a class="btn" href="admin-monday.html">Admin</a><a class="btn" href="portal-monday.html">Portal</a></section><section class="card"><h2>Projects</h2><div id="list"></div></section></main><script>fetch('https://rhp-portal-worker.archeabelief.workers.dev/company-data?t='+Date.now()).then(r=>r.json()).then(d=>{status.textContent='Loaded '+(d.metrics.projects||0)+' project records';let a=d.tabs.projects||[];list.innerHTML=a.map(x=>'<div class="job"><b>'+String(x.contact||x.name||'Project')+'</b><br><span class="pill">'+String(x.status||x.boardName||'Monday')+'</span><br>'+String(x.address||'')+(x.url?'<br><a class="btn" target="_blank" href="'+x.url+'">Open in Monday</a>':'')+'</div>').join('')||'<p>No projects.</p>'}).catch(e=>status.textContent='Data issue: '+e.message)</script></body></html>
