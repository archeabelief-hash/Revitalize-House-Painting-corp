<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Leaderboard Secure</title><style>body{font-family:Arial;margin:0;background:#f7f5ef}main{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d7d0bf;border-radius:18px;padding:18px;margin:10px 0}h1{color:#37412f}.btn{display:inline-block;margin:5px;padding:12px;background:#37412f;color:#fff;border-radius:12px;text-decoration:none}</style></head><body><main><div id='lock' class='card'><h1>Access Required</h1><p>Only sales agents or admin can view leaderboard.</p><a class='btn' href='portal.html'>Go to Portal</a></div><div id='ok' class='card' style='display:none'><iframe src='sales-leaderboard.html' style='width:100%;height:80vh;border:0'></iframe></div></main><script>let admin=localStorage.getItem('revitalize_admin_logged_in')==='yes';let sess=localStorage.getItem('revitalize_portal_session');let acc=JSON.parse(localStorage.getItem('revitalize_accounts')||'[]');let user=acc.find(x=>String(x.id)===sess);if(admin||(user&&user.type==='sales_agent')){lock.style.display='none';ok.style.display='block';}</script></body></html>
