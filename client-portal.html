<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revitalize Client Portal</title><style>body{margin:0;background:#0e1117;color:#f5f7fb;font-family:Arial,system-ui,sans-serif}.app{max-width:900px;margin:auto;padding:16px}.card{background:#151a23;border:1px solid #ffffff1a;border-radius:20px;padding:18px;margin:12px 0}.logo{display:inline-grid;place-items:center;width:52px;height:52px;background:#fdab3d;color:#111;border-radius:16px;font-weight:900}.brand{display:flex;gap:12px;align-items:center}p{color:#aab4c3}input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff1a;background:#10151f;color:white;font:inherit}textarea{min-height:100px}button,.button{border:0;border-radius:12px;padding:11px 14px;background:#fdab3d;color:#111;font-weight:900;text-decoration:none;cursor:pointer}.secondary{background:#1c2330!important;color:#fff!important;border:1px solid #ffffff1a}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.notice{border-left:4px solid #e2445c;background:#e2445c1a;padding:12px;border-radius:12px;color:#aab4c3}.record{border:1px solid #ffffff1a;border-radius:14px;padding:12px;margin:10px 0;background:#ffffff08}.kv{display:grid;grid-template-columns:120px 1fr;gap:8px;border-bottom:1px solid #ffffff1a;padding:8px 0}.hidden{display:none}</style></head><body><main class="app"><section class="card"><div class="brand"><div class="logo">RHP</div><div><h1>Property Manager / Client Portal</h1><p>Live Revitalize House Painting client view.</p></div></div><div class="controls"><input id="accessInput" placeholder="Access code"><button onclick="saveAndLoad()">Load Portal</button><button class="secondary" onclick="loadPortal()">Refresh</button></div><p id="status">Enter your access code.</p><div id="err" class="notice hidden"></div></section><section class="card"><h2>Access</h2><div id="accessPanel"></div></section><section class="card"><h2>Linked Properties / Projects</h2><div id="work"></div></section><section class="card"><h2>Request Work or Update</h2><textarea id="msg" placeholder="Send a new work request or property note..."></textarea><div class="controls"><button onclick="sendReq()">Send Request</button></div></section></main><script>const WORKER='https://rhp-portal-worker.archeabelief.workers.dev';function qs(n){return new URLSearchParams(location.search).get(n)}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function code(){let c=qs('access')||qs('code')||localStorage.rhp_client_access||'';if(c)localStorage.rhp_client_access=c;return c}function showErr(t){err.classList.remove('hidden');err.textContent=t}function clearErr(){err.classList.add('hidden');err.textContent=''}function records(a,e){return a&&a.length?a.map(r=>'<div class="record"><b>'+esc(r.name)+'</b><br>'+(r.url?'<a class="button secondary" target="_blank" href="'+esc(r.url)+'">Open in Monday</a>':'')+'</div>').join(''):'<p>'+esc(e)+'</p>'}function render(d){let a=d.access||{};accessPanel.innerHTML='<div class="kv"><b>Name</b><span>'+esc(a.personName||'—')+'</span></div><div class="kv"><b>Company</b><span>'+esc(a.companyProperty||'—')+'</span></div><div class="kv"><b>Status</b><span>'+esc(a.status||'—')+'</span></div>';work.innerHTML=records(d.workItems,'No linked project/work record yet.')}async function loadPortal(){clearErr();let c=code();accessInput.value=c;if(!c){status.textContent='Enter your access code to load the portal.';return}status.textContent='Refreshing Monday data...';try{let r=await fetch(WORKER+'/portal?access='+encodeURIComponent(c)+'&type=client&t='+Date.now(),{cache:'no-store'});let d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Portal failed');render(d);status.textContent='Live data loaded from Monday.'}catch(e){status.textContent='Could not load portal data.';showErr(e.message)}}function saveAndLoad(){let v=accessInput.value.trim();if(v)localStorage.rhp_client_access=v;loadPortal()}async function sendReq(){let c=code(),m=msg.value.trim();if(!c||!m)return alert('Access code and message required.');let r=await fetch(WORKER+'/portal/request-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access:c,type:'client',message:m})});let d=await r.json();if(!r.ok||!d.ok)return alert(d.error||'Request failed');msg.value='';alert('Request sent.')}loadPortal();</script></body></html>
