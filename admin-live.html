<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><style>body{margin:0;font-family:Arial;background:#f7f5ef;color:#1b1b1b}main{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d7d0bf;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 20px #0001}h1{font-family:Georgia,serif;color:#37412f}.btn{display:inline-block;margin:6px;padding:12px 14px;border-radius:12px;background:#37412f;color:#fff;text-decoration:none;font-weight:900}.gold{background:#b69a55;color:#111}.light{background:#eef0ea;color:#37412f;border:1px solid #d7d0bf}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:#fff;border:1px solid #d7d0bf;border-radius:8px;padding:8px;font-size:12px;min-height:60px}.event{background:#37412f;color:#fff;padding:4px;border-radius:6px;margin-top:4px;font-size:11px}</style></head><body><main><section class='card'><h1>Admin Dashboard</h1><a class='btn' href='sales-leaderboard.html'>Sales Leaderboard</a><a class='btn light' href='portal-live.html'>Portal</a><a class='btn light' href='./'>Booking</a></section><section class='card'><h2>Calendar View</h2><div id='cal' class='calendar'></div></section></main><script>const leads=JSON.parse(localStorage.getItem('revitalize_booking_leads')||'[]');const cal=document.getElementById('cal');for(let i=1;i<=30;i++){let d=document.createElement('div');d.className='day';d.innerHTML='<b>'+i+'</b>';let matches=leads.filter(l=>l.scheduledDate&&new Date(l.scheduledDate).getDate()===i);matches.forEach(m=>{let e=document.createElement('div');e.className='event';e.textContent=m.mainServices||'Job';d.appendChild(e)});cal.appendChild(d)}</script></body></html>
